
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-storyboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-storyboard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - assets_data:/data/assets
    # Reset the startup-check marker whenever the container starts or restarts.
    command: ["/bin/sh", "-c", "rm -f /tmp/api-startup-ready; exec ./server"]
    environment:
      ASSET_STORAGE_ROOT: /data/assets
      ASSET_MAX_UPLOAD_BYTES: ${ASSET_MAX_UPLOAD_BYTES-10485760}
      ASSET_MAX_PIXELS: ${ASSET_MAX_PIXELS-25000000}
      AGENT_MAX_OPS: ${AGENT_MAX_OPS-20}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS-15}
      PORT: ":8080"
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-storyboard}:${POSTGRES_PASSWORD:-local_dev_password}@db:5432/${POSTGRES_DB:-storyboard}?sslmode=disable
      JWT_SECRET: 8cbe00fdd374ee458f2a863a4b7620a1039fa2eb64163726992d5ddfb8d477a2
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Once startup succeeds, subsequent checks use the marker without HTTP calls.
      test: ["CMD-SHELL", "test -f /tmp/api-startup-ready || { wget -q -O /dev/null http://127.0.0.1:8080/health && touch /tmp/api-startup-ready; }"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_TARGET: http://api:8080
      FRONTEND_HOST: 0.0.0.0
      FRONTEND_PORT: "5173"
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  assets_data:
